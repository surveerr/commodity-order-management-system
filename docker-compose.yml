services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: orders, POSTGRES_USER: orders, POSTGRES_PASSWORD: orders}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U orders -d orders"], interval: 5s, timeout: 3s, retries: 20}
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    healthcheck: {test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
  kafka:
    image: bitnamilegacy/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck: {test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"], interval: 10s, timeout: 10s, retries: 20}
  eureka-server:
    build: ./backend/eureka-server
    ports: ["8761:8761"]
  instrument-service:
    build: ./backend/instrument-service
    environment: {SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/instruments, SPRING_DATA_REDIS_HOST: redis, SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092, EUREKA_URL: http://eureka-server:8761/eureka/, JWT_SECRET: "${JWT_SECRET:-local-development-secret-change-this-32-bytes-minimum}"}
    depends_on: {mongodb: {condition: service_healthy}, redis: {condition: service_healthy}, kafka: {condition: service_healthy}, eureka-server: {condition: service_started}}
    ports: ["8082:8082"]
  order-service:
    build: ./backend/order-service
    environment: {SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders, SPRING_DATASOURCE_USERNAME: orders, SPRING_DATASOURCE_PASSWORD: orders, SPRING_DATA_REDIS_HOST: redis, SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092, EUREKA_URL: http://eureka-server:8761/eureka/, JWT_SECRET: "${JWT_SECRET:-local-development-secret-change-this-32-bytes-minimum}"}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, kafka: {condition: service_healthy}, eureka-server: {condition: service_started}, instrument-service: {condition: service_started}}
    ports: ["8081:8081"]
  api-gateway:
    build: ./backend/api-gateway
    environment: {EUREKA_URL: http://eureka-server:8761/eureka/, FRONTEND_ORIGIN: http://localhost:4200}
    depends_on: [eureka-server, order-service, instrument-service]
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    depends_on: [api-gateway]
    ports: ["4200:80"]
